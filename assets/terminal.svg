<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .title { fill: #8b949e; font-size: 12px; }
    .ps { fill: #7ee787; }
    .path { fill: #79c0ff; }
    .dim { fill: #8b949e; }
    .hl { fill: #ffa657; }
    .accent { fill: #d2a8ff; }

    /* a line stays hidden until its animation-delay */
    .out { opacity: 0; animation: show 0.01s forwards; }
    @keyframes show { to { opacity: 1; } }

    /* typing: a background-colored block slides right one character (8.4px) at a time */
    .cover { fill: #0d1117; }
    @keyframes type6  { to { transform: translateX(50.4px); } }
    @keyframes type11 { to { transform: translateX(92.4px); } }
    @keyframes type12 { to { transform: translateX(100.8px); } }
    @keyframes type16 { to { transform: translateX(134.4px); } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="820" height="330" rx="10" fill="#0d1117"/>
  <path d="M0 10 a10 10 0 0 1 10 -10 h800 a10 10 0 0 1 10 10 v22 h-820z" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text class="title" x="410" y="20" text-anchor="middle">izzy@svtr: ~</text>

  <!-- prompt "~ $ " is 4 chars, so commands start at x = 20 + 4 * 8.4 ≈ 54 -->

  <!-- 1. whoami -->
  <text x="20" y="60"><tspan class="path">~</tspan> <tspan class="ps">$</tspan> whoami</text>
  <rect class="cover" x="53" y="46" width="58" height="20" style="animation: type6 0.6s steps(6) 0.3s forwards"/>
  <g class="out" style="animation-delay:1.0s">
    <text x="20" y="82">Izzy Xia <tspan class="dim">(@ezshrimps)</tspan> · AI builder <tspan class="hl">@ SVTR</tspan> · CS <tspan class="hl">@ UC Irvine</tspan></text>
  </g>

  <!-- 2. cat now.txt -->
  <g class="out" style="animation-delay:1.2s">
    <text x="20" y="116"><tspan class="path">~</tspan> <tspan class="ps">$</tspan> cat now.txt</text>
    <rect class="cover" x="53" y="102" width="100" height="20" style="animation: type11 1.0s steps(11) 1.4s forwards"/>
  </g>
  <g class="out" style="animation-delay:2.6s"><text x="20" y="138"><tspan class="accent">▸</tspan> an AI agent that turns startup pitch decks into structured deal data</text></g>
  <g class="out" style="animation-delay:2.8s"><text x="20" y="160"><tspan class="accent">▸</tspan> WeChat mini-programs on the SVTR AI Venture Database <tspan class="dim">(7,100+ AI startups)</tspan></text></g>
  <g class="out" style="animation-delay:3.0s"><text x="20" y="182"><tspan class="accent">▸</tspan> LLM pipelines that automate social media content</text></g>

  <!-- 3. ls ~/side-quests -->
  <g class="out" style="animation-delay:3.1s">
    <text x="20" y="216"><tspan class="path">~</tspan> <tspan class="ps">$</tspan> ls ~/side-quests</text>
    <rect class="cover" x="53" y="202" width="142" height="20" style="animation: type16 1.3s steps(16) 3.3s forwards"/>
  </g>
  <g class="out" style="animation-delay:4.8s">
    <text x="20" y="238"><tspan class="path">ShrimpDiet/</tspan>  <tspan class="path">LyricsParser/</tspan>  <tspan class="path">Maidle/</tspan>  <tspan class="path">maimai-toolbar/</tspan>  <tspan class="dim">pickleball.md</tspan></text>
  </g>

  <!-- 4. echo $STATUS -->
  <g class="out" style="animation-delay:5.0s">
    <text x="20" y="272"><tspan class="path">~</tspan> <tspan class="ps">$</tspan> echo $STATUS</text>
    <rect class="cover" x="53" y="258" width="109" height="20" style="animation: type12 1.0s steps(12) 5.2s forwards"/>
  </g>
  <g class="out" style="animation-delay:6.4s">
    <text x="20" y="294" class="hl">open to AI engineering internships · say hi → ezshrimps.com</text>
  </g>

  <!-- final prompt -->
  <g class="out" style="animation-delay:6.8s">
    <text x="20" y="318"><tspan class="path">~</tspan> <tspan class="ps">$</tspan> <tspan class="cursor">▋</tspan></text>
  </g>
</svg>
